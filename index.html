<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>원격 지필평가 환경 점검 퀘스트</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #121826;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .quest-box {
            position: relative;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 24px 20px 20px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .tag {
            background-color: #f43f5e;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 999px;
            letter-spacing: 0.5px;
        }
        .sound-toggle {
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }
        .stage-title {
            color: #38bdf8;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .question {
            font-size: 19px;
            font-weight: 600;
            line-height: 1.5;
            color: #ffffff;
            margin: 16px 0 28px 0;
            min-height: 58px;
            word-break: keep-all;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        button.action-btn {
            flex: 1;
            padding: 16px 10px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
            outline: none;
        }
        button.action-btn:active {
            transform: scale(0.97);
        }
        .btn-yes {
            background-color: #10b981;
            color: #ffffff;
        }
        .btn-no {
            background-color: #f43f5e;
            color: #ffffff;
        }
        .btn-reset {
            background-color: #475569;
            color: #ffffff;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }
        .result-box {
            background-color: #0f172a;
            border-radius: 14px;
            padding: 18px;
            text-align: left;
            line-height: 1.6;
            font-size: 15px;
            word-break: keep-all;
        }
        .result-pass {
            border-left: 5px solid #10b981;
        }
        .result-fail {
            border-left: 5px solid #f43f5e;
        }
        .footer {
            margin-top: 10px;
            padding-top: 14px;
            border-top: 1px dashed #334155;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: -0.3px;
        }
    </style>
</head>
<body>

<div class="quest-box">
    <div>
        <div class="header-bar">
            <span class="tag" id="stage-tag">STAGE 1</span>
            <button id="bgmBtn" class="sound-toggle" onclick="toggleBGM()">🔊 BGM OFF</button>
        </div>
        <div id="game-content"></div>
    </div>
    <div class="footer">
        만든이: 경남온라인학교 최홍현
    </div>
</div>

<script>
    // Web Audio API 음향 시스템 (모바일 브라우저 터치 언락 호환)
    let audioCtx = null;
    let isBgmPlaying = false;
    let bgmTimer = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, duration, type = "square", volume = 0.04) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playSfx(type) {
        initAudio();
        if (type === 'click') {
            playTone(440, 0.08, 'square', 0.04);
        } else if (type === 'pass') {
            stopBGM();
            setTimeout(() => playTone(523.25, 0.1, 'triangle', 0.08), 0);
            setTimeout(() => playTone(659.25, 0.1, 'triangle', 0.08), 100);
            setTimeout(() => playTone(783.99, 0.1, 'triangle', 0.08), 200);
            setTimeout(() => playTone(1046.50, 0.3, 'triangle', 0.1), 300);
        } else if (type === 'fail') {
            stopBGM();
            setTimeout(() => playTone(300, 0.15, 'sawtooth', 0.08), 0);
            setTimeout(() => playTone(240, 0.15, 'sawtooth', 0.08), 150);
            setTimeout(() => playTone(180, 0.3, 'sawtooth', 0.1), 300);
        }
    }

    const bgmNotes = [
        261.63, 0, 329.63, 392.00, 523.25, 392.00, 329.63, 0,
        220.00, 0, 261.63, 329.63, 440.00, 329.63, 261.63, 0,
        174.61, 0, 220.00, 261.63, 349.23, 261.63, 220.00, 0,
        196.00, 0, 246.94, 293.66, 392.00, 293.66, 246.94, 0
    ];
    let noteIndex = 0;

    function playBgmStep() {
        if (!isBgmPlaying) return;
        const note = bgmNotes[noteIndex];
        if (note > 0) {
            playTone(note, 0.12, 'triangle', 0.015);
        }
        noteIndex = (noteIndex + 1) % bgmNotes.length;
        bgmTimer = setTimeout(playBgmStep, 160);
    }

    function toggleBGM() {
        initAudio();
        isBgmPlaying = !isBgmPlaying;
        const btn = document.getElementById("bgmBtn");
        if (isBgmPlaying) {
            btn.innerText = "🔊 BGM ON";
            noteIndex = 0;
            playBgmStep();
        } else {
            stopBGM();
        }
    }

    function stopBGM() {
        isBgmPlaying = false;
        clearTimeout(bgmTimer);
        const btn = document.getElementById("bgmBtn");
        if (btn) btn.innerText = "🔇 BGM OFF";
    }

    // 시나리오 데이터
    const stages = {
        q1: {
            tag: "STAGE 1",
            title: "⚔️ 필수 장비 점검",
            question: "카메라(웹캠) 기능이 정상 작동하는 PC/노트북을 사용하나요?",
            yes: "q2",
            no: "q1_sub"
        },
        q1_sub: {
            tag: "STAGE 1-B",
            title: "🛡️ 장비 수급 점검",
            question: "평가 시간에 PC 대여나 별도 사용 준비가 가능한가요?",
            yes: "q2",
            no: "fail_device"
        },
        q2: {
            tag: "STAGE 2",
            title: "🔮 독립 공간 점검",
            question: "시험 시간 동안 서로 가까이에서 보지 않는 독립된 공간에서 응시하나요?",
            yes: "pass",
            no: "fail_room"
        },
        pass: {
            tag: "QUEST CLEAR",
            title: "🎉 원격 지필평가 가능!",
            type: "pass",
            text: "<strong>장비와 독립 공간 준비가 모두 충족되었습니다.</strong><br>안내된 시험 일정에 맞춰 침착하게 응시해 주세요."
        },
        fail_device: {
            tag: "QUEST FAILED",
            title: "🚨 지필평가 진행 곤란 (기기 미비)",
            type: "fail",
            text: "<strong>시험용 PC/카메라 사용이 불가능합니다.</strong><br>즉시 담임선생님께 연락해 학교 기기 대여를 요청하세요."
        },
        fail_room: {
            tag: "QUEST FAILED",
            title: "🚨 지필평가 진행 곤란 (공간 미비)",
            type: "fail",
            text: "<strong>독립된 응시 공간 확보가 어렵습니다.</strong><br>즉시 담임선생님께 연락해 학교 내 별도 시험실 배정을 상담하세요."
        }
    };

    function handleChoice(nextStage) {
        playSfx('click');
        renderStage(nextStage);
    }

    function renderStage(stageKey) {
        const current = stages[stageKey];
        const tagEl = document.getElementById("stage-tag");
        const content = document.getElementById("game-content");

        tagEl.innerText = current.tag;

        if (stageKey.startsWith("pass") || stageKey.startsWith("fail")) {
            playSfx(current.type);
            content.innerHTML = `
                <h2 style="color: ${current.type === 'pass' ? '#10b981' : '#f43f5e'}; margin: 12px 0;">${current.title}</h2>
                <div class="result-box ${current.type === 'pass' ? 'result-pass' : 'result-fail'}">
                    ${current.text}
                </div>
                <button class="btn-reset" onclick="handleChoice('q1')">🔄 처음부터 다시 진단하기</button>
            `;
        } else {
            content.innerHTML = `
                <div class="stage-title">${current.title}</div>
                <div class="question">${current.question}</div>
                <div class="btn-group">
                    <button class="action-btn btn-yes" onclick="handleChoice('${current.yes}')">⭕ 예 (YES)</button>
                    <button class="action-btn btn-no" onclick="handleChoice('${current.no}')">❌ 아니오 (NO)</button>
                </div>
            `;
        }
    }

    renderStage("q1");
</script>

</body>
</html>
